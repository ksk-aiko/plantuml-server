# Added: minimal service topology for Phase 1 MVP
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - plantuml_net

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    networks:
      - plantuml_net

  plantuml:
    image: plantuml/plantuml-server:jetty
    networks:
      - plantuml_net

networks:
  plantuml_net:
    driver: bridge